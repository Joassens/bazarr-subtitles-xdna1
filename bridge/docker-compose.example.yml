# Example only: the bridge on its own, for when npusubs runs on another machine (or you use another speech service).
# For the normal case (bridge + npusubs together) use ../compose.yml: `docker compose up -d` in the repository root, which
# builds the bridge from bridge/Dockerfile. Keep real API keys out of git (use config/secrets.env).
services:
  whisperbridge:
    image: mccloud/bazarr-openai-whisperbridge     # the upstream image provides the Python environment
    container_name: whisperbridge
    ports:
      - "9500:9000"                                # point Bazarr's Whisper provider at http://<host>:9500
    environment:
      OPENAI_API_KEY: "not-needed"                 # required by the OpenAI client library; everything else
                                                   # is configured in config/bridge.json (see config.example/)
    volumes:
      - ./bridge.py:/app/bazarr-openai-whisperbridge.py:ro
      - ../subcfg/subcfg.py:/app/subcfg.py:ro      # shared configuration library
      - ../config:/config                          # bridge.json, schemas/, secrets.env (copy ../config.example);
                                                   # read-write: the web UI stores its password and your changes here (:ro = no web UI sign-in possible)
      - ./ui:/app/ui:ro                            # the web UI at /ui
    restart: unless-stopped
