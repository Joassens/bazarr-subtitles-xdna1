<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subtitle bridge</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2430;--mute:#667085;--line:#e3e7ee;--acc:#2f6fed;--ok:#1a9d57;--warn:#d98a00;--bad:#d1383d;--chip:#eef2f8}
@media (prefers-color-scheme:dark){:root{--bg:#0f141b;--card:#171e28;--ink:#e6ebf2;--mute:#8b97a8;--line:#273141;--acc:#6a9bff;--ok:#38c07c;--warn:#f0a928;--bad:#ff6b70;--chip:#222c3a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:2}
h1{font-size:16px;margin:0 8px 0 0}nav{display:flex;gap:4px}nav a{padding:6px 12px;border-radius:8px;color:var(--mute);text-decoration:none;cursor:pointer}
nav a.on{background:var(--chip);color:var(--ink);font-weight:600}.sp{flex:1}.muted{color:var(--mute)}
main{padding:20px 20px 90px;max-width:1200px;margin:0 auto}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}.card h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);margin:0 0 10px}
.wide{grid-column:1/-1}.row{display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--line)}.row:first-of-type{border-top:0}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none;background:var(--mute)}.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--mute);font-size:12px;margin:0 4px 2px 0}.chip.acc{background:color-mix(in srgb,var(--acc) 18%,transparent);color:var(--acc)}
.chip.on{color:var(--ok)}.chip.off{color:var(--mute)}.chip.bad{color:var(--bad)}.chip.src-file{color:var(--acc)}.chip.src-env{color:var(--warn)}.chip.mod{background:color-mix(in srgb,var(--warn) 22%,transparent);color:var(--warn)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px}.grow{flex:1;min-width:0;word-break:break-word}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:7px 8px;border-top:1px solid var(--line);vertical-align:top}th{color:var(--mute);font-weight:500;font-size:12px;border-top:0}
input[type=search],input[type=text],input[type=number],select,textarea{padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);font:inherit;width:100%}
input[type=search]{width:min(380px,100%)}textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;min-height:64px}
input[type=checkbox]{width:18px;height:18px;vertical-align:middle}input:disabled,select:disabled,textarea:disabled{opacity:.55}
tr.bad td{background:color-mix(in srgb,var(--bad) 8%,transparent)}tr.changed td{background:color-mix(in srgb,var(--warn) 7%,transparent)}
button{padding:7px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5;cursor:default}button.link{border:0;background:none;color:var(--acc);padding:0 4px;font-size:12px}
.err{color:var(--bad)}.sec{margin:22px 0 6px;font-size:15px}.tiny{font-size:12px}.num{text-align:right;white-space:nowrap}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;z-index:3}
.bar .msg{flex:1;min-width:200px}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.ok{color:var(--ok)}.diff-old{color:var(--bad)}.diff-new{color:var(--ok)}
.orow{display:flex;gap:6px;align-items:flex-start;margin:4px 0;flex-wrap:wrap}.orow select,.orow input,.orow textarea{width:auto;min-width:130px;flex:1}
.cols{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.form{display:grid;gap:10px;max-width:720px}.form label{display:block;font-size:12px;color:var(--mute);margin-bottom:2px}
pre{white-space:pre-wrap;word-break:break-word;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin:0}td.diff{background:color-mix(in srgb,var(--warn) 16%,transparent)}
</style>
</head>
<body>
<header>
  <h1>Subtitle bridge</h1>
  <nav id="nav"><a data-t="dashboard">Dashboard</a><a data-t="backends">Backends</a><a data-t="config">Configuration</a><a data-t="profiles">Profiles</a><a data-t="playground">Playground</a><a data-t="history">History</a></nav>
  <span class="sp"></span><span id="chip" class="muted tiny"></span>
</header>
<main id="view"><p class="muted">Loading…</p></main>
<div id="bar" class="bar" hidden></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tab = (location.hash || "#dashboard").slice(1), status = null, config = null, filter = "", component = "bridge";
let draft = {}, resets = new Set(), saveErrors = [], notice = "", history = null, compare = null;
const dur = s => { if (s == null) return "–"; s = Math.round(s); const h = Math.floor(s/3600), m = Math.floor(s%3600/60); return h ? `${h}h ${m}m` : m ? `${m}m ${s%60}s` : `${s}s`; };
const ago = s => s < 90 ? "just now" : dur(s) + " ago";
const dot = (ok, warn) => `<span class="dot ${ok ? "ok" : warn ? "warn" : "bad"}"></span>`;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
async function api(p, body) {
  const opt = {credentials: "same-origin"};
  if (body !== undefined) { opt.method = "POST"; opt.headers = {"Content-Type": "application/json", "X-Requested-With": "ui"}; opt.body = JSON.stringify(body); }
  const r = await fetch(p, opt);
  let data = null; try { data = await r.json(); } catch (e) {}
  if (!r.ok) { const e = new Error((data && (data.error || (data.errors || []).join("; "))) || r.status); e.status = r.status; e.errors = data && data.errors; throw e; }
  return data;
}
function val(r) {
  if (r.secret) return r.value ? `<span class="muted">••••••••</span>` : `<span class="muted">(empty)</span>`;
  const v = r.value;
  if (typeof v === "boolean") return `<span class="chip ${v ? "on" : "off"}">${v ? "on" : "off"}</span>`;
  if (Array.isArray(v)) return v.length ? v.map(x => `<div class="mono">${esc(x)}</div>`).join("") : `<span class="muted">(empty)</span>`;
  if (v === "" || v == null) return `<span class="muted">(empty)</span>`;
  return `<span class="mono">${esc(v)}</span>`;
}
function dashboard() {
  const s = status, b = s.bridge, cfg = b.config;
  const flags = Object.entries(b.flags).map(([k, v]) => `<span class="chip ${v ? "on" : "off"}">${esc(k.replace("_", " "))}: ${v ? "on" : "off"}</span>`).join("");
  const cfgLine = !cfg ? `<span class="chip">config layer off</span>` :
    cfg.errors.length ? `<div class="err tiny">${cfg.errors.map(esc).join("<br>")}</div>` : `<span class="chip on">config OK</span>`;
  const speech = s.speech.length ? s.speech.map((x, i) => {
    const d = x.detail || {}, cur = d.current;
    return `<div class="row">${dot(x.ok)}<div class="grow"><b>${esc(x.url)}</b>
      ${i === s.speech_in_use ? '<span class="chip acc">in use now</span>' : ""}<br>
      <span class="muted tiny">${esc(x.kind)}${x.ms != null ? " · " + x.ms + " ms" : ""}${x.error ? " · " + esc(x.error) : ""}</span>
      ${x.kind === "npusubs" ? `<div class="tiny">model ${esc(d.model)} · beam ${esc(d.beam)} · VAD ${d.vad ? "on" : "off"} · diarization: ${esc(d.diarization)} · ${esc(d.requests)} requests</div>
        <div class="tiny">${cur ? `<span class="chip acc">NPU busy</span> ${dur(cur.audio_s)} audio, running ${dur(cur.running_s)}` : `<span class="chip on">NPU idle</span>`}</div>
        ${(d.config_errors || []).length ? `<div class="err tiny">${d.config_errors.map(esc).join("<br>")}</div>` : ""}` : ""}
      </div></div>`; }).join("") : `<p class="muted">No speech services configured; the OpenAI-compatible fallback is used.</p>`;
  const llm = s.llm.filter(x => x.configured).map(x => `<div class="row">${dot(x.ok)}<div class="grow"><b>${esc(x.role)}</b>
      ${x.role === s.llm_in_use ? '<span class="chip acc">used for translation</span>' : ""}<br>
      <span class="mono">${esc(x.url)}</span><br><span class="muted tiny">model ${esc(x.model)}${x.ms != null ? " · " + x.ms + " ms" : ""}${x.error ? " · " + esc(x.error) : ""}</span>
      ${x.loaded.length ? `<div class="tiny">loaded: ${x.loaded.map(esc).join(", ")}</div>` : ""}</div></div>`).join("") || `<p class="muted">No LLM endpoint configured.</p>`;
  const arr = s.arr.length ? s.arr.map(x => `<div class="row">${dot(x.ok)}<div class="grow"><b>${esc(x.name)}</b> <span class="muted tiny">${esc(x.url)}${x.ms != null ? " · " + x.ms + " ms" : ""}</span></div></div>`).join("") : `<p class="muted">Not configured.</p>`;
  const jobs = s.jobs.length ? `<table><tr><th>File</th><th>Task</th><th>Audio</th><th>Backends used</th><th>Status</th><th class="num">Time</th><th class="num">Started</th></tr>` +
    s.jobs.map(j => `<tr><td class="grow">${j.has_srt || j.has_detail ? `<button class="link" data-act="openjob" data-id="${j.id}">${esc(j.file || "job " + j.id)}</button>` : esc(j.file || "–")}${j.profile ? ` <span class="chip acc">${esc(j.profile)}</span>` : ""}</td><td>${esc(j.task)}${j.language ? " · " + esc(j.language) : ""}</td><td>${j.pcm_mb} MB</td>
      <td class="tiny">${(j.backends || []).map(esc).join("<br>") || "–"}</td>
      <td>${j.status === "done" ? '<span class="chip on">done</span>' : j.status === "running" ? '<span class="chip acc">running</span>' : j.status === "waiting" ? `<span class="chip mod">waiting</span><div class="tiny muted">${esc(j.waiting_for)}</div>` : j.status === "skipped" ? '<span class="chip">skipped</span>' : `<span class="chip bad">error</span><div class="err tiny">${esc(j.error)}</div>`}</td>
      <td class="num">${dur(j.running_s)}</td><td class="num muted">${ago(j.age_s)}</td></tr>`).join("") + `</table>` : `<p class="muted">No requests since the bridge started.</p>`;
  return `<div class="grid">
    <div class="card"><h2>Bridge</h2><div class="row"><div class="grow"><b>v${esc(b.version)}</b> <span class="muted">· up ${dur(b.uptime_s)}</span><br>${cfgLine}<div style="margin-top:6px">${flags}
      <span class="chip ${b.prefer_native ? "on" : "off"}">prefer speech services: ${b.prefer_native ? "yes" : "no"}</span></div>
      ${cfg ? `<div class="tiny muted">config: <span class="mono">${esc(cfg.dir)}</span> · ${cfg.files.map(f => esc(f.name) + (f.present ? " ✓" : " –")).join(" · ")}</div>` : ""}</div></div></div>
    <div class="card"><h2>Speech services</h2>${speech}</div>
    <div class="card"><h2>Translation LLM</h2>${llm}</div>
    <div class="card"><h2>Sonarr / Radarr</h2>${arr}</div>
    ${guardCard(s.guard)}
    <div class="card wide"><h2>Recent requests</h2>${jobs}</div></div>`;
}
function guardCard(g) {
  if (!g) return "";
  const ram = g.ram, rows = [];
  rows.push(`<div class="row">${dot(g.in_window)}<div class="grow"><b>Allowed hours</b> <span class="muted">${g.window ? esc(g.window) : "any time"}</span>
    ${g.window ? `<br><span class="tiny muted">${g.in_window ? "inside the window now, jobs run" : "outside the window now, new jobs wait"}</span>` : ""}</div></div>`);
  rows.push(`<div class="row">${dot(!g.min_free_ram_gb || !g.ram_configured || (ram && ram.free_gb >= g.min_free_ram_gb), g.ram_configured && !ram)}<div class="grow"><b>Host RAM</b>
    ${ram ? `<span class="mono">${ram.free_gb.toFixed(1)} GB free of ${ram.total_gb.toFixed(1)}</span>` : g.ram_configured ? '<span class="muted">endpoint not answering</span>' : '<span class="muted">not monitored (set guard.host_ram_url)</span>'}
    ${g.min_free_ram_gb ? `<br><span class="tiny muted">translations wait below ${g.min_free_ram_gb} GB free</span>` : ""}</div></div>`);
  const n = (g.llm_loaded || []).length;
  rows.push(`<div class="row">${dot(n <= g.max_llm_models)}<div class="grow"><b>LLMs loaded</b> <span class="mono">${n} / ${g.max_llm_models}</span>
    ${n ? `<br><span class="tiny">${g.llm_loaded.map(esc).join(", ")}</span>` : ""}${n > g.max_llm_models ? '<br><span class="err tiny">more than allowed: check the host RAM</span>' : ""}</div></div>`);
  if (g.waiting) rows.push(`<div class="row">${dot(false, true)}<div class="grow"><b>${g.waiting} job${g.waiting > 1 ? "s" : ""} waiting</b></div></div>`);
  return `<div class="card"><h2>Resource guard</h2>${rows.join("")}</div>`;
}
function jobView() {
  const d = S.jobView, j = d.job, det = d.detail;
  const head = `<div class="tools"><button data-act="closejob">← Back</button><b>${esc(j.file || "job " + j.id)}</b><span class="muted">${esc(j.task)}${j.language ? " · " + esc(j.language) : ""} · ${j.status} · ${dur(j.seconds)}</span>
    ${j.profile ? `<span class="chip acc">${esc(j.profile)}</span>` : ""}${d.srt != null ? `<a href="/ui/api/jobs/${j.id}/srt"><button>Download SRT</button></a>` : ""}</div>${j.error ? `<p class="err">${esc(j.error)}</p>` : ""}${d.note ? `<p class="muted">${esc(d.note)}</p>` : ""}`;
  let body = "";
  if (det) {
    const changed = det.source.filter((_, i) => det.draft[i] !== det.final[i]).length;
    body += `<p class="muted tiny">${det.source.length} lines; the review ${det.review ? `changed <b>${changed}</b> of them (highlighted, with the reason)` : "was off"}.</p>
      ${det.bible ? `<details><summary>Translation bible</summary><pre>${esc(det.bible)}</pre></details>` : ""}
      <table><tr><th>#</th><th>Source</th><th>Draft</th><th>Final</th><th>Why</th></tr>${det.source.map((s, i) => { const c = det.draft[i] !== det.final[i];
        return `<tr><td class="num muted tiny">${i + 1}</td><td>${esc(s)}</td><td>${esc(det.draft[i])}</td><td class="${c ? "diff" : ""}">${esc(det.final[i])}</td><td class="tiny muted">${esc(det.why[i] || "")}</td></tr>`; }).join("")}</table>`;
  } else if (d.srt != null) body += `<pre>${esc(d.srt)}</pre>`;
  return `<div class="card">${head}${body}</div>`;
}
function backends() {
  const s = status;
  const speech = s.speech.map((x, i) => `<div class="row">${dot(x.ok)}<div class="grow"><b>${i + 1}. ${esc(x.url)}</b>
    ${i === s.speech_in_use ? '<span class="chip acc">in use now</span>' : ""}<br><span class="muted tiny">${esc(x.kind)}${x.ms != null ? " · " + x.ms + " ms" : ""}${x.error ? " · " + esc(x.error) : ""}</span></div></div>`).join("");
  const rows = s.llm.map(x => x.configured ? `<tr><td>${dot(x.ok)} ${esc(x.role)}${x.role === s.llm_in_use ? ' <span class="chip acc">in use now</span>' : ""}</td>
    <td class="mono">${esc(x.url)}</td><td class="mono">${esc(x.model)}</td><td class="num">${x.ms != null ? x.ms + " ms" : "–"}</td>
    <td class="tiny">${x.loaded.length ? "loaded: " + x.loaded.map(esc).join(", ") : x.available.slice(0, 4).map(esc).join(", ")}</td></tr>` :
    `<tr><td>${esc(x.role)}</td><td colspan="4" class="muted">not configured</td></tr>`).join("");
  return `<div class="card"><h2>Speech services, in order of preference</h2>
      <p class="muted tiny">The first reachable service is used. An offline one is skipped for a while so it does not slow each request.
      ${s.bridge.prefer_native ? "These are used whenever reachable." : "An OpenAI-compatible fallback may win when it answers faster."}
      Change the list under Configuration → bridge → <span class="mono">backends.speech_urls</span> (one URL per line).</p>${speech || '<p class="muted">None configured.</p>'}</div>
    <div class="card" style="margin-top:16px"><h2>Translation LLM</h2>
      <p class="muted tiny">A dedicated LLM wins whenever it is reachable; otherwise the faster of primary and fallback is used.</p>
      <table><tr><th>Role</th><th>Endpoint</th><th>Model</th><th class="num">Latency</th><th>Models</th></tr>${rows}</table></div>`;
}

// ---------------------------------------------------------------- configuration (view + edit)
const SECTIONS = {backends: "Backends", llm: "LLM endpoints", whisper: "Whisper", diarization: "Diarization", translation: "Translation",
  subtitles: "Subtitles", filters: "Filters", audio: "Audio", arr: "Sonarr / Radarr", ui: "Web UI", general: "General", vad: "Voice activity detection",
  music: "Music", engine: "Engine", server: "Server", guard: "Resource guard"};
const inFile = k => config.file && Object.prototype.hasOwnProperty.call(config.file, k);
const baseValue = r => resets.has(r.key) ? r.default : inFile(r.key) ? config.file[r.key] : r.value;
const editorValue = r => r.key in draft ? draft[r.key] : baseValue(r);
const canEdit = r => config.can_write && !r.secret && r.source !== "env";
const fieldErr = k => saveErrors.filter(e => e.startsWith(k + ":") || e.startsWith(k + " "));
function editor(r) {
  const v = editorValue(r), id = "f_" + r.key, dis = canEdit(r) ? "" : " disabled";
  if (r.secret) return `<span class="muted">${r.value ? "••••••••" : "(empty)"} · set in secrets.env</span>`;
  if (r.type === "boolean") return `<input type="checkbox" id="${id}" data-k="${esc(r.key)}"${v ? " checked" : ""}${dis}>`;
  if (r.enum) return `<select id="${id}" data-k="${esc(r.key)}"${dis}>${r.enum.map(o => `<option${o === v ? " selected" : ""}>${esc(o)}</option>`).join("")}</select>`;
  if (r.type === "array") return `<textarea id="${id}" data-k="${esc(r.key)}" data-arr="1" rows="${Math.max(2, (v || []).length + 1)}"${dis}>${esc((v || []).join("\n"))}</textarea><div class="muted tiny">one per line</div>`;
  if (r.type === "integer" || r.type === "number")
    return `<input type="number" id="${id}" data-k="${esc(r.key)}" data-num="${r.type}" value="${esc(v)}"${r.min != null ? ` min="${r.min}"` : ""}${r.max != null ? ` max="${r.max}"` : ""}${r.type === "number" ? ' step="any"' : ""}${dis}>`;
  return `<input type="text" id="${id}" data-k="${esc(r.key)}" value="${esc(v)}"${dis}>`;
}
function writeBanner(hint) {
  return `<div class="card" style="margin:10px 0;border-color:var(--warn)"><b>Read-only.</b> ${esc(hint || "Editing is switched off.")}</div>`;
}
function configView() {
  const c = config;
  if (!c.enabled) return `<div class="card">The configuration layer is off (set up a config folder and the schemas).</div>`;
  const q = filter.toLowerCase();
  const rows = c.rows.filter(r => !q || (r.key + r.title + (r.description || "")).toLowerCase().includes(q));
  const bySec = {};
  rows.forEach(r => (bySec[r.section] = bySec[r.section] || []).push(r));
  const errs = c.errors.length ? `<div class="card err" style="margin-bottom:10px">${c.errors.map(esc).join("<br>")}</div>` : "";
  const comps = (c.components || []).map(n => `<option${n === component ? " selected" : ""}>${esc(n)}</option>`).join("");
  const sections = Object.entries(bySec).map(([sec, rs]) => `<h3 class="sec">${esc(SECTIONS[sec] || sec)}</h3><div class="card"><table>
    ${rs.map(r => {
      const mod = r.key in draft || resets.has(r.key), fe = fieldErr(r.key);
      const reset = canEdit(r) && ((inFile(r.key) && !resets.has(r.key)) || r.key in draft) ? `<button class="link" data-reset="${esc(r.key)}">reset to default</button>` : "";
      return `<tr class="${fe.length ? "bad" : mod ? "changed" : ""}"><td style="width:34%"><b>${esc(r.title)}</b><br><span class="mono muted">${esc(r.key)}</span>${r.description ? `<div class="muted tiny">${esc(r.description)}</div>` : ""}</td>
      <td>${editor(r)}${fe.map(e => `<div class="err tiny">${esc(e)}</div>`).join("")}${r.source === "env" ? `<div class="tiny" style="color:var(--warn)">Overridden by environment variable <span class="mono">${esc(r.env)}</span>; remove it from the compose file to edit here. Current value: ${val(r)}</div>` : ""}</td>
      <td style="width:20%"><span class="chip ${resets.has(r.key) ? "" : r.source === "file" ? "src-file" : r.source === "env" ? "src-env" : ""}">${esc(resets.has(r.key) ? "default (after save)" : r.source)}</span>
      ${mod ? '<span class="chip mod">modified</span>' : ""}${r.restart ? '<span class="chip">restart needed</span>' : ""}<div>${reset}</div></td></tr>`; }).join("")}</table></div>`).join("");
  const note = c.can_write ? "" : writeBanner(c.write_hint);
  return `${errs}<div class="tools"><label>Component <select id="comp">${comps}</select></label><input type="search" id="q" placeholder="Filter settings…" value="${esc(filter)}">
    <span class="muted tiny">Source: <b>default</b> (schema), <b>file</b> (<span class="mono">${esc(c.dir)}</span>), <b>env</b> (an environment variable overrides the file). Secrets are managed in <span class="mono">secrets.env</span>.</span></div>${note}

    const body = src.map((s, i) => { const base = res[0] && res[0].lines[i];
      return `<tr><td class="num muted tiny">${i + 1}</td><td>${esc(s)}</td>${res.map((r, j) => `<td class="${j && r.lines[i] !== undefined && base !== undefined && r.lines[i] !== base ? "diff" : ""}">${r.status === "error" ? "" : esc(r.lines[i] ?? "")}</td>`).join("")}</tr>`; }).join("");
    return `<div class="card" style="margin-top:16px">${head}<table><tr><th>#</th><th>Source</th>${res.map(r => `<th>${esc(r.name)}${r.status === "error" ? ` <span class="err tiny">${esc(r.error)}</span>` : ""}</th>`).join("")}</tr>${body}</table>
      <p class="muted tiny">Highlighted: lines that differ from the first variant.</p></div>`;
  }
  return `<div class="card" style="margin-top:16px">${head}<div class="cols">${run.results.map(r => `<div><b>${esc(r.name)}</b> <span class="muted tiny">${(r.srt.match(/-->/g) || []).length} cues</span>
    ${r.error ? `<div class="err tiny">${esc(r.error)}</div>` : ""}<pre>${esc(r.srt)}</pre></div>`).join("")}</div></div>`;
}
Object.assign(actions, {
  async openjob(el) { try { S.jobView = await api("/ui/api/jobs/" + el.dataset.id); } catch (x) { alert(x.message); } render(); },
  closejob() { S.jobView = null; render(); }
});
function render() {
  document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("on", a.dataset.t === tab));
  const v = $("#view");
  try {
    if (tab === "config") {
      if (!config) { v.innerHTML = '<p class="muted">Loading…</p>'; bar(); return; }
      const f = document.activeElement && document.activeElement.id === "q"; v.innerHTML = configView();
      const q = $("#q"); if (q) { q.oninput = e => { readFields(); filter = e.target.value; render(); }; if (f) { q.focus(); q.setSelectionRange(filter.length, filter.length); } }
      const cs = $("#comp"); if (cs) cs.onchange = e => { if (Object.keys(draft).length + resets.size && !confirm("Discard unsaved changes?")) { e.target.value = component; return; }
        component = e.target.value; draft = {}; resets = new Set(); saveErrors = []; notice = ""; config = null; history = null; load(); };
      v.querySelectorAll("[data-k]").forEach(el => el.onchange = () => { readFields(); notice = ""; saveErrors = []; render(); });
      v.querySelectorAll("[data-reset]").forEach(b => b.onclick = () => { readFields(); const k = b.dataset.reset; delete draft[k]; resets.add(k); render(); });
    } else if (tab === "profiles" || tab === "playground") {
      v.innerHTML = tab === "profiles" ? profilesView() : playgroundView(); bindDelegated(v);
    } else if (tab === "history") {
      v.innerHTML = histView();
      const hs = $("#hcomp"); if (hs) hs.onchange = e => { component = e.target.value; history = null; compare = null; config = null; notice = ""; saveErrors = []; load(); };
      v.querySelectorAll("[data-cmp]").forEach(b => b.onclick = async () => { try { compare = {name: b.dataset.cmp, ...(await api(`/ui/api/history/${component}/${b.dataset.cmp}`))}; } catch (e) { saveErrors = [e.message]; } render(); });
      v.querySelectorAll("[data-restore]").forEach(b => b.onclick = async () => {
        if (!confirm("Restore " + b.dataset.restore + "? The current file is snapshotted first.")) return;
        try { await api(`/ui/api/history/${component}/${b.dataset.restore}/restore`, {}); notice = "Restored and applied."; saveErrors = []; compare = null; history = null; config = null; await load(); }
        catch (e) { saveErrors = e.errors || [e.message]; render(); } });
    } else if (!status) v.innerHTML = '<p class="muted">Loading…</p>';
    else { v.innerHTML = tab === "backends" ? backends() : S.jobView ? jobView() : dashboard(); bindDelegated(v); }
  } catch (e) { v.innerHTML = `<div class="card err">UI error: ${esc(e.message)}</div>`; }
  bar();
}
async function load() {
  try {
    if (tab === "config") { if (!config || !Object.keys(draft).length) config = await api("/ui/api/config?component=" + component); }
    else if (tab === "history") { history = await api("/ui/api/history/" + component); if (!status) status = await api("/ui/api/status"); }
    else if (tab === "profiles" || tab === "playground") {
      S.profData = await api("/ui/api/profiles");
      if (tab === "playground") { const l = await api("/ui/api/playground"); S.play.list = l.runs; S.play.canRun = l.can_run; S.play.hint = l.write_hint; S.play.limits = l.limits;
        if (!S.play.run && l.runs.length) await openRun(l.runs[0].id); }
    }
    else status = await api("/ui/api/status");
    $("#chip").textContent = "updated " + new Date().toLocaleTimeString();
    render();
  } catch (e) { $("#view").innerHTML = `<div class="card err">${esc(e.message)}</div>`; }
}
document.querySelectorAll("#nav a").forEach(a => a.onclick = () => { if (tab === "config") readFields(); tab = a.dataset.t; location.hash = tab; S.jobView = null; notice = ""; saveErrors = []; if (tab !== "history") compare = null; render(); load(); });
load(); setInterval(() => { if ((tab === "dashboard" || tab === "backends") && !document.hidden && !S.jobView) load(); }, 5000);
</script>
